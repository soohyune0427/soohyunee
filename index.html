<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이수현 · 포트폴리오</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
  :root {
    --bg: #faf8ff;
    --surface: #ffffff;
    --ink: #1b1924;
    --muted: #6f6a7e;
    --faint: #9b95a9;
    --line: #ece7f6;
    --accent: #7b6cd9;
    --accent-soft: #efebfb;
    --accent-ink: #544a9e;
    --kor-font: "Pretendard";
    --density: 1;
    --disp: "Space Grotesk", "Pretendard", sans-serif;
    --maxw: 1120px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--kor-font), "Pretendard", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: #fff; }

  a { color: inherit; text-decoration: none; }

  .container {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 40px;
  }

  /* soft ambient lavender wash */
  .page::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 50% at 85% -5%, var(--accent-soft) 0%, transparent 60%),
      radial-gradient(50% 40% at -10% 30%, var(--accent-soft) 0%, transparent 55%);
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }
  .page { position: relative; z-index: 1; }

  /* ---------- entrance (opacity-safe: content always visible) ---------- */
  @media (prefers-reduced-motion: no-preference) {
    [data-reveal] {
      animation: settle 0.7s cubic-bezier(.22,.61,.36,1) both;
    }
    .hero [data-reveal]:nth-child(2) { animation-delay: .05s; }
    .hero [data-reveal]:nth-child(3) { animation-delay: .10s; }
    .hero [data-reveal]:nth-child(4) { animation-delay: .15s; }
    .hero [data-reveal]:nth-child(5) { animation-delay: .20s; }
    .hero__aside[data-reveal] { animation-delay: .18s; }
  }
  @keyframes settle {
    from { transform: translateY(16px); }
    to   { transform: translateY(0); }
  }

  /* ---------- HERO ---------- */
  .hero {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: calc(96px * var(--density)) 40px calc(64px * var(--density));
    position: relative;
  }
  .hero__grid {
    display: grid;
    grid-template-columns: 1.4fr 0.85fr;
    gap: 56px;
    align-items: center;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--disp);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.24em;
    color: var(--accent-ink);
    margin-bottom: 26px;
  }
  .kicker__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .headline {
    font-family: var(--disp);
    font-weight: 700;
    font-size: clamp(56px, 9vw, 132px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin-bottom: 30px;
  }
  .headline__line { display: block; }
  .headline__accent {
    color: var(--accent);
    -webkit-text-stroke: 0;
    position: relative;
  }
  .headline__accent::after {
    content: "";
    display: inline-block;
    width: clamp(40px, 6vw, 84px);
    height: clamp(8px, 1vw, 14px);
    background: var(--accent);
    border-radius: 99px;
    margin-left: 18px;
    vertical-align: middle;
  }
  .hero__id {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 18px;
  }
  .hero__name {
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
  }
  .hero__birth {
    font-family: var(--disp);
    font-size: 16px;
    font-weight: 500;
    color: var(--faint);
  }
  .hero__tagline {
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-ink);
    margin-bottom: 16px;
  }
  .hero__intro {
    max-width: 540px;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 30px;
    text-wrap: pretty;
  }
  .hero__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .chip {
    display: inline-flex;
    flex-direction: column;
    gap: 3px;
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    text-align: left;
    font: inherit;
  }
  .chip__label {
    font-family: var(--disp);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--faint);
  }
  .chip__value { font-size: 14px; font-weight: 600; color: var(--ink); }
  .chip--btn { cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .chip--btn:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -16px var(--accent);
  }

  .hero__aside { display: flex; flex-direction: column; gap: 14px; }
  .portrait {
    aspect-ratio: 4 / 5;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 60px -40px rgba(84,74,158,0.5);
    background: var(--accent-soft);
  }
  .portrait__tag {
    align-self: flex-start;
    padding: 9px 16px;
    border-radius: 99px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  .hero__scroll {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 70px;
    font-family: var(--disp);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--faint);
  }
  .hero__scrollline {
    flex: 1;
    max-width: 120px;
    height: 1px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .hero__scrollline::after {
    content: "";
    position: absolute;
    left: -40%;
    top: 0;
    width: 40%;
    height: 100%;
    background: var(--accent);
    animation: slide 2.4s ease-in-out infinite;
  }
  @keyframes slide { 0%{left:-40%} 60%,100%{left:100%} }

  /* ---------- SECTION LABEL ---------- */
  .section { padding: calc(86px * var(--density)) 0 0; }
  .seclabel {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 48px;
  }
  .seclabel__idx {
    font-family: var(--disp);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  .seclabel__txt {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .seclabel__rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---------- CAREER ---------- */
  .career__head { margin-bottom: 40px; }
  .career__lede {
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 760px;
    text-wrap: balance;
  }
  .career__lede strong {
    color: var(--accent);
    font-family: var(--disp);
  }
  .timeline { list-style: none; }
  .tl {
    display: grid;
    grid-template-columns: 150px 24px 1fr;
    gap: 22px;
    padding: 28px 0;
    border-top: 1px solid var(--line);
    align-items: start;
  }
  .tl:last-child { border-bottom: 1px solid var(--line); }
  .tl__period {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--disp);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-ink);
    padding-top: 3px;
  }
  .tl__live {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(123,108,217,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(123,108,217,0); }
    100% { box-shadow: 0 0 0 0 rgba(123,108,217,0); }
  }
  .tl__node {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--bg);
    margin: 7px auto 0;
  }
  .tl__role { font-size: 19px; font-weight: 700; color: var(--ink); }
  .tl__org { font-size: 15px; font-weight: 600; color: var(--accent-ink); margin-top: 2px; }
  .tl__note { font-size: 14px; color: var(--muted); margin-top: 8px; }

  /* ---------- PROJECTS ---------- */
  .projects {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }
  .pcard {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s, border-color .35s;
  }
  .pcard:hover {
    transform: translateY(-6px);
    box-shadow: 0 28px 50px -34px rgba(84,74,158,0.55);
    border-color: var(--accent);
  }
  .pcard__thumb {
    position: relative;
    aspect-ratio: 16 / 11;
    background: var(--accent-soft);
  }
  .pcard__n {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 2;
    font-family: var(--disp);
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 8px;
    pointer-events: none;
  }
  .pcard__info { padding: 22px 22px 24px; display: flex; flex-direction: column; flex: 1; }
  .pcard__sub {
    font-family: var(--disp);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 7px;
  }
  .pcard__title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .pcard__desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .pcard__tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 5px 11px;
    border-radius: 99px;
  }
  .pcard__link {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .pcard:hover .pcard__link svg { transform: translate(2px,-2px); }
  .pcard__link svg { transition: transform .3s; }

  /* ---------- FOOTER ---------- */
  .footer {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: calc(86px * var(--density)) 40px calc(60px * var(--density));
  }
  .footer__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    padding: 36px 0 48px;
    border-bottom: 1px solid var(--line);
  }
  .footer__k {
    font-family: var(--disp);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 12px;
  }
  .footer__v { font-size: 18px; font-weight: 700; color: var(--ink); }
  .footer__sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .footer__email {
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    border-bottom: 2px solid transparent;
    transition: border-color .2s;
  }
  .footer__email:hover { border-color: var(--accent); }
  .footer__ig {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    transition: color .2s;
  }
  .footer__ig svg { color: var(--accent); }
  .footer__ig:hover { color: var(--accent-ink); }
  .footer__cta {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-top: 40px;
  }
  .footer__big {
    font-family: var(--disp);
    font-size: clamp(48px, 11vw, 130px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .footer__year {
    font-family: var(--disp);
    font-size: 14px;
    font-weight: 500;
    color: var(--faint);
  }

  /* ---------- image-slot polish ---------- */
  image-slot { --is-placeholder-color: var(--accent-ink); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px) {
    .hero__grid { grid-template-columns: 1fr; gap: 40px; }
    .hero__aside { max-width: 320px; }
    .projects { grid-template-columns: 1fr; }
    .footer__grid { grid-template-columns: 1fr; gap: 24px; }
  }
  @media (max-width: 620px) {
    .container, .hero, .footer { padding-left: 22px; padding-right: 22px; }
    .tl { grid-template-columns: 1fr; gap: 6px; }
    .tl__node { display: none; }
    .hero__meta { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
